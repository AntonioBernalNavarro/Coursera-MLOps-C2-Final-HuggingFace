name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5   # Actualizado a v5 (Node 24)
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v6   # Actualizado a v6 (Node 24)
        with:
          python-version: '3.12'
          
      - name: install packages
        run: make install
        
      - name: lint
        run: make lint
        
      - name: test
        run: make test
        
      - name: format
        run: make format
        
      - name: deploy
        run: echo "Skipping deploy step for this laboratory assignment."