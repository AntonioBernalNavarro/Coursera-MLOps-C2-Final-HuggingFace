name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: install packages
        run: make install
        
      - name: lint
        run: make lint
        
      - name: test
        run: make test
        
      - name: format
        run: make format
        
      # El paso de deploy se ha comentado o reemplazado porque no hay un destino de despliegue en este laboratorio.
      # Si tienes un Makefile con un comando 'deploy' funcional, puedes descomentar la siguiente línea.
      - name: deploy
        run: echo "Skipping deploy step for this laboratory assignment."